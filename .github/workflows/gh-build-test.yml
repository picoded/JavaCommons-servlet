name: JavaCommons-servlet CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive  # Initializes and fetches all nested submodules recursively

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle          # Automatically caches Gradle wrapper and dependencies

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compile and Assemble Classes
      run: ./gradlew testClasses

    - name: Execute Unit Tests
      run: ./gradlew test
